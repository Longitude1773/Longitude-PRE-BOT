<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Version A — Semantic</title>
  <style>
    body { font: 16px system-ui, sans-serif; padding: 24px; margin: 0; }
    .card h2 { font-size: 28px; line-height: 1.2; margin: 0; font-weight: bold; }
    .badge {
      display: inline-block;
      background: #e53935; color: white;
      padding: 4px 12px; border-radius: 6px;
      font-size: 22px; font-weight: bold;
      vertical-align: 4px;
    }
    .cols {
      columns: 2; column-gap: 40px; max-width: 560px;
      margin: 16px 0 0; padding-left: 40px;
      font-size: 20px; line-height: 1.8;
    }
    .cols li { margin: 0; }
  </style>
</head>
<body>
  <section class="card">
    <h2>Winter Jacket <span class="badge">Sale!</span></h2>
    <ul class="cols">
      <li>Waterproof</li>
      <li>Insulated</li>
      <li>Hooded</li>
      <li>Machine washable</li>
    </ul>
  </section>
</body>
</html>
